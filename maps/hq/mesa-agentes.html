<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa dos agentes</title>
<style>
  :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { padding: 4px; color: #fff7d6; text-shadow: 0 1px 1px #21180e; }
  .painel { height: 100%; background: transparent; padding: 3px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 5px; height: 24px; padding: 0 5px; border: 2px solid #58381d; border-radius: 6px; background: rgba(62, 43, 30, .94); }
  h1 { margin: 0; font-size: 10px; letter-spacing: .05em; }
  #placar { font-size: 9px; font-weight: 800; color: #ffe29a; white-space: nowrap; }
  #cadeiras { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding-top: 3px; }
  .cadeira { min-width: 0; height: 40px; border: 1px solid #4f351f; border-radius: 5px; background: rgba(62, 43, 30, .92); padding: 3px 4px; box-shadow: inset 0 -2px 0 #291c14; }
  .cadeira.vazia { opacity: .48; border-style: dashed; display: grid; place-items: center; color: #d0b58b; font-size: 8px; }
  .linha { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .luz { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #57e389; box-shadow: 0 0 6px #57e389; }
  .bloqueado .luz { background: #ffbf4b; box-shadow: 0 0 6px #ffbf4b; }
  .nome { font-size: 8px; font-weight: 900; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .projeto { margin-left: auto; color: #e7c58f; font-size: 7px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tarefa { margin-top: 2px; color: #fff7d6; font-size: 8px; line-height: 1.05; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #estado { height: calc(100% - 24px); display: grid; place-items: center; text-align: center; color: #ffe29a; font-size: 10px; }
  #fila { margin-top: 2px; padding: 2px 4px; border-radius: 5px; background: rgba(111, 40, 30, .94); color: #ffd1c9; font-size: 8px; font-weight: 800; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="painel" aria-live="polite">
  <header><h1>MESA DOS AGENTES</h1><span id="placar">conectando</span></header>
  <div id="estado">Lendo o HQ ao vivo...</div>
  <section id="cadeiras" hidden></section>
  <div id="fila" hidden></div>
</main>
<script>
(function () {
  const API = "http://127.0.0.1:8898/agentes";
  const cadeiras = document.getElementById("cadeiras");
  const estado = document.getElementById("estado");
  const placar = document.getElementById("placar");
  const fila = document.getElementById("fila");

  function escapar(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderizar(dados) {
    const capacidade = Number(dados.capacidade) || 8;
    const ocupados = Array.isArray(dados.ocupados) ? dados.ocupados : [];
    const emFila = Array.isArray(dados.fila) ? dados.fila : [];
    const blocos = ocupados.map((agent) => `
      <article class="cadeira ${agent.estado === "blocked" ? "bloqueado" : ""}" title="${escapar(agent.tarefa)}">
        <div class="linha"><span class="luz"></span><span class="nome">${escapar(agent.nome)}</span><span class="projeto">${escapar(agent.projeto)}</span></div>
        <div class="tarefa">${escapar(agent.tarefa)}</div>
      </article>`);

    while (blocos.length < capacidade) blocos.push('<article class="cadeira vazia">cadeira livre</article>');
    cadeiras.innerHTML = blocos.join("");
    placar.textContent = `${ocupados.length}/${capacidade}`;
    fila.hidden = ocupados.length < capacidade;
    fila.textContent = emFila.length ? `MESA CHEIA · ${emFila.length} NA FILA` : "MESA CHEIA";
    estado.hidden = true;
    cadeiras.hidden = false;
  }

  function indisponivel() {
    cadeiras.hidden = true;
    fila.hidden = true;
    estado.hidden = false;
    estado.textContent = "Mesa sem sinal do Herdr";
    placar.textContent = "offline";
  }

  async function atualizar() {
    try {
      const resposta = await fetch(API, { cache: "no-store" });
      if (!resposta.ok) throw new Error(String(resposta.status));
      renderizar(await resposta.json());
    } catch (_) {
      indisponivel();
    }
  }

  window.mesaAgentes = { atualizar, renderizar, indisponivel };
  atualizar();
  setInterval(atualizar, 2000);
})();
</script>
</body>
</html>
