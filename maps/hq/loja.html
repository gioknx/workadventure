<!doctype html>
<html lang="pt-BR" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja do HQ</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#191f2b;--line:#2c3545;--text:#f4f6fb;--muted:#9ca9bc;--gold:#f1c75b;--good:#66d39a;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#253046 0,#10141d 48%);color:var(--text);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:30px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:32px;line-height:1.08;margin:5px 0 7px}.sub{color:var(--muted);margin:0}.saldo{min-width:150px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(25,31,43,.9);text-align:right}.saldo span{display:block;color:var(--muted);font-size:12px}.saldo strong{display:block;color:var(--gold);font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;overflow:hidden;display:flex;min-height:272px;flex-direction:column;align-items:center;padding:20px 15px 15px;border:1px solid var(--line);border-radius:18px;background:rgba(25,31,43,.95);box-shadow:0 18px 45px rgba(0,0,0,.18)}.card[data-owned=true]{border-color:rgba(102,211,154,.55)}.sprite{width:96px;height:96px;margin:2px 0 16px;background-repeat:no-repeat;background-size:288px 384px;background-position:-96px 0;image-rendering:pixelated;filter:drop-shadow(0 10px 10px rgba(0,0,0,.28))}.card h2{font-size:17px;margin:0;text-align:center}.price{color:var(--gold);font-weight:800;margin:5px 0 16px}.card button{width:100%;margin-top:auto;border:0;border-radius:11px;padding:11px 10px;background:var(--gold);color:#17130a;font:inherit;font-weight:850;cursor:pointer}.card button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}.card button:disabled{background:#313a4a;color:#8995a7;cursor:not-allowed}.card[data-owned=true] button{background:#204a39;color:#9af0c0}.status{min-height:22px;margin:18px 2px 0;color:var(--muted)}.status[data-kind=error]{color:var(--danger)}.status[data-kind=success]{color:var(--good)}html[data-state=loading] .grid{opacity:.55}html[data-state=error] .grid{display:none}@media(max-width:720px){main{padding:22px 16px}header{align-items:start;flex-direction:column}.saldo{text-align:left}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:390px){h1{font-size:27px}.grid{grid-template-columns:1fr}.card{min-height:270px}}@media print{body{background:#fff;color:#111}.card,.saldo{background:#fff;border-color:#bbb;box-shadow:none}.sub,.status,.saldo span{color:#555}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">HQ Comercial</div><h1>Loja do HQ</h1><p class="sub">Prestígio pessoal vira visual: roupa do seu Woka e bicho que anda atrás de você. Pontos do squad não entram aqui.</p></div>
    <div class="saldo"><span>SEUS PONTOS</span><strong id="saldo">—</strong></div>
  </header>
  <section class="grid" id="catalogo" aria-label="Catálogo da loja"></section>
  <p class="status" id="status" role="status">Carregando catálogo…</p>
</main>
<script>
const API="http://localhost:8901";
const parametros=new URLSearchParams(location.search);
const nome=parametros.get("nome")||"";
const uuid=parametros.get("uuid")||"";
const elementos={catalogo:document.querySelector("#catalogo"),saldo:document.querySelector("#saldo"),status:document.querySelector("#status")};
let catalogo=[];let conta={pontos:0,inventario:[]};
const ROTULO={skin:"Roupa do seu Woka",companion:"Bicho que anda atrás de você"};
function possui(id){return conta.inventario.some((item)=>item.item_id===id)}
function botaoTexto(item){if(possui(item.id))return"Resgatado";if(conta.pontos<item.preco_pontos)return`Faltam ${item.preco_pontos-conta.pontos}`;return`Resgatar · ${item.preco_pontos}`}
function renderizar(){elementos.saldo.textContent=conta.pontos;elementos.catalogo.replaceChildren(...catalogo.map((item)=>{const card=document.createElement("article");card.className="card";card.dataset.owned=String(possui(item.id));card.dataset.tipo=item.tipo;const sprite=document.createElement("div");sprite.className="sprite";sprite.style.backgroundImage=`url(${JSON.stringify(item.textura)})`;sprite.setAttribute("role","img");sprite.setAttribute("aria-label",item.nome);const titulo=document.createElement("h2");titulo.textContent=item.nome;const tipo=document.createElement("p");tipo.className="tipo";tipo.textContent=ROTULO[item.tipo]||item.tipo;const preco=document.createElement("div");preco.className="price";preco.textContent=`${item.preco_pontos} pontos`;const botao=document.createElement("button");botao.textContent=botaoTexto(item);botao.disabled=possui(item.id)||conta.pontos<item.preco_pontos;botao.addEventListener("click",()=>resgatar(item,botao));card.append(sprite,titulo,tipo,preco,botao);return card}))}
async function carregar(){if(!nome&&!uuid)throw new Error("Identidade do jogador não foi informada.");const alvo=`${API}/saldo/${encodeURIComponent(nome||uuid)}?uuid=${encodeURIComponent(uuid)}`;const [catalogoResposta,saldoResposta]=await Promise.all([fetch(`${API}/catalogo`,{cache:"no-store"}),fetch(alvo,{cache:"no-store"})]);if(!catalogoResposta.ok||!saldoResposta.ok)throw new Error("Não foi possível consultar a loja.");catalogo=await catalogoResposta.json();conta=await saldoResposta.json();renderizar();elementos.status.textContent=`Catálogo liberado para ${conta.nome}.`;document.documentElement.dataset.state="ready"}
async function resgatar(item,botao){botao.disabled=true;elementos.status.textContent=`Resgatando ${item.nome}…`;elementos.status.dataset.kind="";const resposta=await fetch(`${API}/resgate`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome,uuid,item_id:item.id})});const dados=await resposta.json();if(!resposta.ok){elementos.status.textContent=dados.erro||"Resgate recusado.";elementos.status.dataset.kind="error";renderizar();return}conta.pontos=dados.pontos;const jaTinha=dados.status==="ja_resgatado";if(!possui(item.id))conta.inventario.push({item_id:item.id,tipo:item.tipo,granted_from:dados.granted_from});renderizar();const destino=item.tipo==="companion"?"seu canil":"seu armário";elementos.status.textContent=jaTinha?`${item.nome} já estava no ${destino}.`:`${item.nome} entrou no ${destino}.`;elementos.status.dataset.kind="success";if(item.tipo==="companion"&&!jaTinha){elementos.status.textContent+=" Abra o menu do WorkAdventure > Companion para soltá-lo."}}
carregar().catch((erro)=>{elementos.status.textContent=erro.message;elementos.status.dataset.kind="error";document.documentElement.dataset.state="error"});
</script>
</body>
</html>
